<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumah Sakit Jiwa Terbengkalai - 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020202;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #110000 0%, #000000 100%);
            color: #dd3333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            cursor: pointer;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 0, 0, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #ui-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #8a8a8a;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="blocker">
        <h1 style="font-size: 3.5rem; margin-bottom: 5px; letter-spacing: 5px; text-shadow: 0 0 10px #ff0000;">ASILUM MAUT</h1>
        <p style="font-size: 1.2rem; color: #bbb; animation: blink 2s infinite;">[ KLIK UNTUK MASUK ]</p>
        <div style="margin-top: 40px; color: #666; font-size: 0.9rem; border: 1px dashed #444; padding: 15px;">
            KONTROL:<br>
            W, A, S, D = Bergerak<br>
            MOUSE = Melihat Sekitar<br>
            F = Nyalakan/Matikan Senter
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="ui-status">Baterai Senter: 100%</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let flashlight, ambientLight, ceilingLight;
        let audioCtx, horrorDrone;
        let flashlightOn = true;

        const blocker = document.getElementById('blocker');
        const uiStatus = document.getElementById('ui-status');

        init();
        animate();

        function init() {
            // 1. Scene & Kabut Tebal (Gelap Total di Jauh)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010103);
            scene.fog = new THREE.FogExp2(0x010103, 0.18);

            // 2. Kamera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.8, 15); // Mulai dari ujung lorong

            // 3. Renderer dengan Bayangan Realistis
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 4. Kontrol Kamera & Mouse Lock
            controls = new PointerLockControls(camera, document.body);

            blocker.addEventListener('click', () => {
                controls.lock();
                startHorrorAudio(); // Jalankan suara hantu saat klik masuk
            });
            controls.addEventListener('lock', () => blocker.style.display = 'none');
            controls.addEventListener('unlock', () => blocker.style.display = 'flex');

            setupInput();

            // 5. Pencahayaan Horor
            ambientLight = new THREE.AmbientLight(0x020205); // Sangat gelap
            scene.add(ambientLight);

            // Senter Pemain
            flashlight = new THREE.SpotLight(0xfff8e7, 4, 22, Math.PI / 5, 0.6, 1.2);
            flashlight.castShadow = true;
            flashlight.shadow.mapSize.width = 2048;
            flashlight.shadow.mapSize.height = 2048;
            scene.add(flashlight);
            flashlight.target = new THREE.Object3D();
            scene.add(flashlight.target);

            // Lampu Rusak di Tengah Lorong
            ceilingLight = new THREE.PointLight(0xddffdd, 1.5, 12);
            ceilingLight.position.set(0, 3.5, 0);
            ceilingLight.castShadow = true;
            scene.add(ceilingLight);

            // 6. Membuat Map & Objek Rumah Sakit
            buildHospital();

            window.addEventListener('resize', onWindowResize);
        }

        // FUNGSI MEMBUAT TEKSTUR DINDING KOTOR & BERDARAH SECARA OTOMATIS
        function createProceduralTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Warna dasar cat rumah sakit usang
            ctx.fillStyle = '#4d5447';
            ctx.fillRect(0, 0, 512, 512);

            // Efek Lumut/Kotoran
            for (let i = 0; i < 80; i++) {
                ctx.fillStyle = `rgba(20, 25, 15, ${Math.random() * 0.2})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 100, Math.random() * 100);
            }

            // Efek Cipratan Darah Tua
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = `rgba(90, 5, 5, ${Math.random() * 0.6})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 30, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1);
            return texture;
        }

        function buildHospital() {
            const wallTex = createProceduralTexture();
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

            // Lorong (Lebar 6, Tinggi 4, Panjang 40)
            const floorGeo = new THREE.PlaneGeometry(6, 40);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 4;
            scene.add(ceiling);

            // Dinding Kiri & Kanan
            const wallGeo = new THREE.PlaneGeometry(40, 4);
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-3, 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(3, 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Dinding Ujung Belakang & Depan
            const endWallGeo = new THREE.PlaneGeometry(6, 4);
            const backWall = new THREE.Mesh(endWallGeo, wallMat);
            backWall.position.set(0, 2, -20);
            scene.add(backWall);

            const frontWall = new THREE.Mesh(endWallGeo, wallMat);
            frontWall.position.set(0, 2, 20);
            frontWall.rotation.y = Math.PI;
            scene.add(frontWall);

            // Tambahan Properti: Kasur Rumah Sakit Berkarat (Gurney)
            createGurney(0, 0, -5);
            createGurney(-2.2, 0, 8);
        }

        function createGurney(x, y, z) {
            const group = new THREE.Group();
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const mattressMat = new THREE.MeshStandardMaterial({ color: 0x555e52, roughness: 0.7 });

            // Alas Kasur
            const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 2.5), mattressMat);
            base.position.y = 0.8;
            base.castShadow = true;
            group.add(base);

            // Kaki-kaki Besi
            const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8);
            const positions = [[0.5, 0.4, 1], [-0.5, 0.4, 1], [0.5, 0.4, -1], [-0.5, 0.4, -1]];
            positions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, ironMat);
                leg.position.set(pos[0], pos[1], pos[2]);
                leg.castShadow = true;
                group.add(leg);
            });

            group.position.set(x, y, z);
            scene.add(group);
        }

        // EFEK SUARA HOROR SINTETIS (Web Audio API - Canggih Tanpa Perlu File Eksternal)
        function startHorrorAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Suara Ambience Rendah (Mencekam)
            horrorDrone = audioCtx.createOscillator();
            const droneGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            horrorDrone.type = 'sawtooth';
            horrorDrone.frequency.setValueAtTime(45, audioCtx.currentTime); // Frekuensi super rendah bas

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(100, audioCtx.currentTime);

            droneGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

            horrorDrone.connect(filter);
            filter.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            horrorDrone.start();
        }

        function setupInput() {
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'KeyF': // Tombol Saklar Senter
                        flashlightOn = !flashlightOn;
                        uiStatus.innerText = `Senter: ${flashlightOn ? 'ON' : 'OFF'}`;
                        break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 28.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 28.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Batasan dinding (Collision)
                if (camera.position.x > 2.5) camera.position.x = 2.5;
                if (camera.position.x < -2.5) camera.position.x = -2.5;
                if (camera.position.z > 19.0) camera.position.z = 19.0;
                if (camera.position.z < -19.0) camera.position.z = -19.0;
            }

            prevTime = time;

            // Logika Arah Senter Mengikuti Kamera
            if (flashlight) {
                flashlight.position.copy(camera.position);
                const dirVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                flashlight.target.position.copy(camera.position).add(dirVector);

                // Efek Senter Rusak (Glitching Flashlight)
                if (flashlightOn) {
                    if (Math.random() > 0.98) { 
                        flashlight.intensity = Math.random() * 0.5; // Tiba-tiba redup kedip
                    } else {
                        flashlight.intensity = 4;
                    }
                } else {
                    flashlight.intensity = 0;
                }
            }

            // Logika Lampu Langit-langit Berkedip Misterius
            if (ceilingLight) {
                if (Math.random() > 0.97) {
                    ceilingLight.intensity = Math.random() * 2;
                } else if (Math.random() > 0.99) {
                    ceilingLight.intensity = 0;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
